<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas and New Year Countdown</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: url('6.png');
            background-size: cover;
            background-position: center;
            font-family: 'Sans-Serif', Sans-Serif;
            color: #ca2026;
        }
        .countdown {
            text-align: center;
        }
        h1 {
            font-size: x-large;
            margin: 0;
            line-height: 1.1; 
        }
        p {
            font-size: large;
            margin: 10px 0 0 0;
        }
    </style>
</head>
<body>

    <div class="countdown">
        <h1 id="countdownText"></h1>
        <p id="countdownSubtext"></p>
    </div>

    <script>
        function updateCountdown() {
            const now = new Date();
            const christmasDate = new Date(`${now.getFullYear()}-12-25T00:00:00`);
            const newYearDate = new Date(`${now.getFullYear() + 1}-01-01T00:00:00`);

            const countdownText = document.getElementById('countdownText');
            const countdownSubtext = document.getElementById('countdownSubtext');

            if (now.toDateString() === christmasDate.toDateString()) {
                countdownText.textContent = 'Merry Christmas, Lista!';
                countdownSubtext.textContent = '';
            } else if (now.toDateString() === newYearDate.toDateString()) {
                countdownText.textContent = 'Happy New Year, Lista!';
                countdownSubtext.textContent = '';
            } else if (now >= christmasDate && now < newYearDate) {
                const diffTime = newYearDate - now;
                const daysLeft = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                countdownText.textContent = `${daysLeft} DAYS`;
                countdownSubtext.textContent = 'Before New Year';
            } else {
                const diffTime = christmasDate - now;
                const daysLeft = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                countdownText.textContent = `${daysLeft} DAYS`;
                countdownSubtext.textContent = 'Before Christmas';
            }
        }

        updateCountdown();
        setInterval(updateCountdown, 1000); // Update every second to ensure precision
    </script>

</body>
</html>
